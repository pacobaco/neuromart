<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-mining Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
</head>
<body>
    <h1>Neuro-mining Dashboard</h1>
    <p>Your balance: <span id="balance">0</span> NTK</p>
    <button id="sendTokensBtn">Send Tokens</button>
<hr>
<h2>NeuroSync Paywall – Rent Synchronized Subjects</h2>
<label>EEG Band:
  <select id="band">
    <option value="alpha">Alpha (8-13 Hz)</option>
    <option value="theta">Theta (4-8 Hz)</option>
    <option value="gamma">Gamma (30+ Hz)</option>
    <option value="beta">Beta (13-30 Hz)</option>
    <option value="delta">Delta (&lt;4 Hz)</option>
  </select>
</label><br><br>
<label>Payment Amount: <input type="number" id="payAmount" value="0.01" step="0.001"></label>
<label>Currency:
  <select id="currency">
    <option value="ETH">ETH</option>
    <option value="USDC">USDC</option>
    <option value="NTK">NTK</option>
    <option value="USD">USD (simulated)</option>
  </select>
</label><br><br>
<button onclick="rentSubjects()">Convert Payment → Synchronized Subjects</button>
<pre id="syncResult"></pre>

<script>
async function rentSubjects() {
  const band = document.getElementById("band").value;
  const amount = parseFloat(document.getElementById("payAmount").value);
  const currency = document.getElementById("currency").value;
  
  // In a real deployment this would call a Flask/ backend endpoint
  // that runs convert_payment_to_subjects()
  document.getElementById("syncResult").textContent = 
    `Requesting ${amount} ${currency} → synchronized subjects on ${band} band...\n` +
    `(Backend would return live PLV streams and subject IDs here)`;
}
</script>
    <script>
        const web3 = new Web3(Web3.givenProvider || "http://localhost:8545");

        async function getBalance() {
            const accounts = await web3.eth.getAccounts();
            const balance = await web3.eth.getBalance(accounts[0]);
            document.getElementById("balance").innerText = web3.utils.fromWei(balance, 'ether');
        }

        document.getElementById('sendTokensBtn').addEventListener('click', async () => {
            const accounts = await web3.eth.getAccounts();
            const amount = web3.utils.toWei("0.1", 'ether');  // 0.1 ETH as example
            const tx = await web3.eth.sendTransaction({
                from: accounts[0],
                to: "recipient_address_here",
                value: amount,
            });
            console.log(tx);
        });

        getBalance();
    </script>
</body>
</html>
